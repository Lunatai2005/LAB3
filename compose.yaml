name: ecommerce-microservices
x-app-env: &app-env
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  KAFKA_BROKERS: kafka:19092
  AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
  CATALOG_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db
  ORDER_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/order_db
  SHIPPING_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/shipping_db
  AUTH_URL: http://auth:3001
  CATALOG_URL: http://catalog:3002
  ORDER_URL: http://order:3003
  SHIPPING_URL: http://shipping:3004
services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB:-platform}" }
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 15 }
  kafka:
    image: apache/kafka:4.3.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"], interval: 5s, timeout: 10s, retries: 20, start_period: 15s }
  kafka-init:
    image: apache/kafka:4.3.1
    command: ["sh", "-c", "for topic in order.created inventory.reserved inventory.rejected order.confirmed order.cancelled shipment.created shipment.cancelled; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1; done"]
    depends_on: { kafka: { condition: service_healthy } }
    restart: "no"
  database-init:
    image: postgres:17-alpine
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_DB: "${POSTGRES_DB:-platform}" }
    command: ["sh", "-c", "for db in auth_db catalog_db order_db shipping_db; do psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc \"SELECT 1 FROM pg_database WHERE datname='$$db'\" | grep -q 1 || createdb -h postgres -U $$POSTGRES_USER $$db; done"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  migrate:
    build: .
    user: root
    environment: *app-env
    command: ["sh", "-c", "npx prisma db push --config services/auth/prisma.config.ts && npx prisma db push --config services/catalog/prisma.config.ts && npx prisma db push --config services/order/prisma.config.ts && npx prisma db push --config services/shipping/prisma.config.ts && node dist/services/auth/src/seed.js && node dist/services/catalog/src/seed.js"]
    depends_on: { database-init: { condition: service_completed_successfully } }
    restart: "no"
  auth:
    build: .
    environment: { <<: *app-env, PORT: 3001 }
    command: ["node", "dist/services/auth/src/server.js"]
    depends_on: { migrate: { condition: service_completed_successfully }, kafka-init: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10 }
  catalog:
    build: .
    environment: { <<: *app-env, PORT: 3002 }
    command: ["node", "dist/services/catalog/src/server.js"]
    depends_on: { migrate: { condition: service_completed_successfully }, kafka-init: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10 }
  order:
    build: .
    environment: { <<: *app-env, PORT: 3003 }
    command: ["node", "dist/services/order/src/server.js"]
    depends_on: { auth: { condition: service_healthy }, catalog: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10 }
  shipping:
    build: .
    environment: { <<: *app-env, PORT: 3004 }
    command: ["node", "dist/services/shipping/src/server.js"]
    depends_on: { migrate: { condition: service_completed_successfully }, kafka-init: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10 }
  gateway:
    build: .
    environment: { <<: *app-env, PORT: 3000, CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}" }
    command: ["node", "dist/services/api-gateway/src/server.js"]
    ports: ["${GATEWAY_PORT:-3000}:3000"]
    depends_on: { auth: { condition: service_healthy }, catalog: { condition: service_healthy }, order: { condition: service_healthy }, shipping: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10 }
volumes:
  postgres_data:
  kafka_data:
